dataset:
  - inputs:
      customer_name: "佐藤 健太"
      company_name: "株式会社テクノソリューション"
      content: |
        AgentBoardの導入を検討しております。
        現在社内のコミュニケーションツールとしてSlackを使用しておりますが、
        AgentBoardとのSlack連携の具体的な手順や設定方法について
        ご教示いただけますでしょうか。
    expected_outputs:
      topic: "product"
      response_body: |
        株式会社テクノソリューション
        佐藤 健太様

        お問い合わせいただきありがとうございます。
        株式会社サンプルエージェントでございます。

        AgentBoardとSlackの連携についてご質問いただきありがとうございます。
        AgentBoardは外部ツールとの連携を重視しており、Slackとの連携も可能です。
        具体的な連携手順や設定方法については、導入支援の一環としてマニュアルの提供や、
        必要に応じて技術的なサポートも行っております。
        詳細な連携フローについては、別途資料をお送りすることも可能ですので、
        ご要望がございましたらお申し付けください。
        今後ともよろしくお願いございます。

  - inputs:
      customer_name: "高橋 一郎"
      company_name: "高橋商事"
      content: |
        自社独自のCRMシステムと連携して、顧客への自動返信を行うAIエージェントを開発したいと考えています。
        開発を依頼する場合の概算費用と、標準的な開発期間を教えていただけますか。
    expected_outputs:
      topic: "development"
      response_body: |
        高橋商事
        高橋 一郎様

        お問い合わせいただきありがとうございます。
        株式会社サンプルエージェントでございます。

        AIエージェントの開発に関するお問い合わせ、誠にありがとうございます。
        CRMシステムと連携した自動返信システムの開発は、弊社の得意分野でございます。
        概算費用につきましては、連携するシステムの仕様や、AIに実行させる業務の複雑さによって変動いたします。
        まずは貴社の現在の業務フローとCRMの仕様をお伺いした上で、詳細なお見積りを作成させていただきます。
        開発期間については、要件定義から設計、開発、テストまで含め、通常で数ヶ月程度を想定しております。
        一度、オンラインにてお打ち合わせのお時間をいただけますと幸いです。
        何卒よろしくお願い申し上げます。

  - inputs:
      customer_name: "匿名"
      company_name: "なし"
      content: |
        【格安】WebサイトのSEO対策をお手伝いします。
        最新のアルゴリズムに対応した施策をご提案可能です。
        実績多数。お気軽にご相談ください。
    expected_outputs:
      topic: "spam"
      response_body: null

  - inputs:
      customer_name: "鈴木 花子"
      company_name: "株式会社あおぞら"
      content: |
        AgentBoardの料金体系について教えてください。
        特に、月間の利用ユーザー数や、AIとの対話回数に上限はありますか。
    expected_outputs:
      topic: "product"
      response_body: |
        株式会社あおぞら
        鈴木 花子様

        お問い合わせいただきありがとうございます。
        株式会社サンプルエージェントでございます。

        AgentBoardの料金体系についてのご質問ですね。
        AgentBoardでは、企業の規模や利用状況に合わせて複数のプランをご用意しております。
        月間の利用ユーザー数に関する制限や、対話回数の上限については、プランによって異なります。
        具体的な料金シミュレーションを作成することも可能ですので、
        現在ご検討されている想定のユーザー数や、月間の想定利用頻度を教えていただけますでしょうか。
        最適なプランをご提案させていただきます。
        よろしくお願いいたします。

  - inputs:
      customer_name: "田中 太郎"
      company_name: "田中製作所"
      content: |
        貴社のオフィスはどこにありますか。
        一度見学に伺いたいと考えています。
    expected_outputs:
      topic: "other"
      response_body: |
        田中製作所
        田中 太郎様

        お問い合わせいただきありがとうございます。
        株式会社サンプルエージェントでございます。

        オフィスの所在地および見学についてのご質問をいただき、ありがとうございます。
        弊社オフィスは東京都内に位置しております。
        現在、セキュリティおよび業務の都合上、事前予約制での見学を承っております。
        まずは詳細な日程や目的をお伺いした上で、調整をさせていただきたく存じます。
        お手数ですが、ご希望の日時をお知らせいただけますでしょうか。
        何卒よろしくお願い申し上げます。

  - inputs:
      customer_name: "伊藤 淳"
      company_name: "株式会社グローバルテック"
      content: |
        製造現場の業務をAIで自動化したいのですが、
        現場の独自のドキュメントを学習させたAIエージェントを構築することは可能でしょうか。
    expected_outputs:
      topic: "development"
      response_body: |
        株式会社グローバルテック
        伊藤 淳様

        お問い合わせいただきありがとうございます。
        株式会社サンプルエージェントでございます。

        製造現場におけるAI活用のご相談、ありがとうございます。
        独自のドキュメント（マニュアル、技術資料等）を学習させたAIエージェントの構築は、
        弊社の得意とする領域でございます。
        RAG（検索拡張生成）技術を用いることで、社内独自の知見を反映した精度の高い回答を実現可能です。
        具体的なドキュメントの種類や、どのような業務を自動化したいか、
        詳しくお聞かせいただけますと、より具体的な導入イメージをご提示できます。
        ぜひ一度、詳細をお聞かせください。
        よろしくお願いいたします。

  - inputs:
      customer_name: "渡辺 恵"
      company_name: "株式会社スマートRetail"
      content: |
        AgentBoardのセキュリティに関するホワイトペーパーや、
        SOC2等の準拠状況について教えてください。
    expected_outputs:
      topic: "product"
      response_body: |
        株式会社スマートRetail
        渡辺 恵様

        お問い合わせいただきありがとうございます。
        株式会社サンプルエージェントでございます。

        AgentBoardのセキュリティに関するお問い合わせ、承知いたしました。
        弊社ではセキュリティを最優先事項として取り組んでおり、
        各種セキュリティ基準への準拠状況をまとめた資料を用意しております。
        ホワイトペーパー等の資料につきましては、お問合せフォームより詳細を伺った上で、
        別途メールにてお送りさせていただきます。
        ご不明な点がございましたら、いつでもお気軽にお申し付けください。
        よろしくお願い申し上げます。

  - inputs:
      customer_name: "不明"
      company_name: "なし"
      content: |
        【高配当】投資案件のご案内です。
        元本保証で月利10%を目指す新プロジェクトをご案内します。
        興味のある方はこちらへ。
    expected_outputs:
      topic: "spam"
      response_body: null

  - inputs:
      customer_name: "小林 健一"
      company_name: "株式会社キャリアアップ"
      content: |
        現在エンジニアの採用活動を行っており、
        貴社のブログやSNS等で求人情報を掲載することは可能でしょうか。
    expected_outputs:
      topic: "other"
      response_body: |
        株式会社キャリアアップ
        小林 健一様

        お問い合わせいただきありがとうございます。
        株式会社サンプルエージェントでございます。

        採用活動に関するご相談をいただき、ありがとうございます。
        誠に恐れ入りますが、現在弊社ではSNSやブログ等への外部企業の求人情報の掲載は行っておりません。
        ご期待に沿えず申し訳ございません。
        何卒ご理解のほどよろしくお願い申し上げます。

  - inputs:
      customer_name: "山下 亮"
      company_name: "株式会社スピード物流"
      content: |
        配送ルートの最適化をAIで実現したいのですが、
        配送状況のリアルタイムなデータと連携させることは可能でしょうか。
    expected_outputs:
      topic: "development"
      response_body: |
        株式会社スピード物流
        山下 亮様

        お問い合わせいただきありがとうございます。
        株式会社サンプルエージェントでございます。

        配送ルートの最適化に関するAI活用のご相談ですね。
        配送状況のリアルタイムデータの連携を含めたAIシステム構築は、
        弊社の開発実績も多く、技術的に対応可能でございます。
        API連携等の具体的な仕様を確認させていただいた上で、
        最適なシステム構成をご提案させていただきます。
        まずは現状の課題や、連携を想定されているデータソースについて
        お聞かせいただけますと幸いです。
        よろしくお願いいたします。
